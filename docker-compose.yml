# Docker Compose конфигурация для SafeWorkHub
# Используется для локальной разработки и тестирования

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: safeworkhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safeworkhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeworkhub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-safeworkhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safeworkhub} -d ${POSTGRES_DB:-safeworkhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeworkhub-network

  # Redis для кэширования и очередей
  redis:
    image: redis:7-alpine
    container_name: safeworkhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeworkhub-network

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: safeworkhub-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-safeworkhub}:${POSTGRES_PASSWORD:-safeworkhub_dev}@postgres:5432/${POSTGRES_DB:-safeworkhub}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - safeworkhub-network

  # Frontend (React/Vite) - только для разработки
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      target: development
    container_name: safeworkhub-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://backend:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - safeworkhub-network

volumes:
  postgres_data:
    name: safeworkhub-postgres-data
  redis_data:
    name: safeworkhub-redis-data

networks:
  safeworkhub-network:
    name: safeworkhub-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
