# Автодеплой на прод после успешного CI

name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

env:
  APP_DIR: /root/safeworkhub

jobs:
  deploy:
    name: Deploy to production
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Проверка, что деплоим тот же коммит
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Синхронизация файлов на сервер
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          ARGS: "-avzr --delete --exclude='.git' --exclude='.github' --exclude='.env' --exclude='infra/traefik/acme/' --exclude='frontend/node_modules' --exclude='backend/.venv'"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.PROD_SSH_HOST }}
          REMOTE_USER: ${{ secrets.PROD_SSH_USER }}
          REMOTE_PORT: ${{ secrets.PROD_SSH_PORT }}
          TARGET: ${{ env.APP_DIR }}
          EXCLUDE: ""

      - name: Деплой (build + up + миграции)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: APP_DIR
          script: |
            set -euo pipefail
            cd $APP_DIR
            docker compose -f docker-compose.prod.yml build backend frontend
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
